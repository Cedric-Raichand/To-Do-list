<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1>To-Do list</h1>
        </div>
        <div class="Date">
            <h2 id="date">Today</h2>
            <div id="Time">
                <h2 id="day">THU</h2>
                <h2 id="time">26</h2>
            </div>
        </div>
        <article id="Design">
            <div class="Design-header">Design</div>
            <div class="design-task">
                <label for="checkbox">
                    <input type="checkbox" name="Checkbox" id="Design-Checkbox">
                </label>
                <p>Create icons for a dashboard</p>
            </div>
            
        </article>
    </div>
   
    
</body>
</html>
